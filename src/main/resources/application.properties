spring.application.name=parking2027

spring.datasource.url=jdbc:mysql://localhost:3306/parqueadero_db_2027?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

server.port=8080

# ---- Tarifas INICIALES (COP). Solo siembran la tabla "tarifas" si un tipo no tiene tarifa vigente.
# ---- Para cambiarlas despues use POST /api/tarifas (conserva el historial).
parking.tarifa.fraccion-minutos=15

parking.tarifa.tipos.carro.hora=6000
parking.tarifa.tipos.carro.fraccion=1500

parking.tarifa.tipos.moto.hora=3000
parking.tarifa.tipos.moto.fraccion=750

parking.tarifa.tipos.bicicleta.hora=1000
parking.tarifa.tipos.bicicleta.fraccion=250

# ---- Espacios INICIALES: se crean solo si la tabla "espacios_parqueo" esta vacia (total 50).
# ---- Numeracion consecutiva: carros 1-25, motos 26-45, bicicletas 46-50.
parking.espacios.iniciales.carro=25
parking.espacios.iniciales.moto=20
parking.espacios.iniciales.bicicleta=5
